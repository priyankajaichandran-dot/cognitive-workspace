<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliDesk - Login</title>
    <!-- Intha line thaan style.css design ah HTML kooda connect pannum -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Login to IntelliDesk</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <p id="errorMessage" style="color: red; display: none; margin-top: 15px;"></p>
    </div>

    <!-- Intha line thaan script.js functionality ah HTML kooda connect pannum -->
    <script src="script.js"></script>
</body>
</html>
